name: upnp_client
description: Universal Plug and Play (UPnP) Client Implementation. Supports IGD control as well as DLNA media casting.
version: 1.4.0

homepage: https://github.com/Hillpro/upnp_client
repository: https://github.com/Hillpro/upnp_client
issue_tracker: https://github.com/Hillpro/upnp_client/issues

topics:
  - upnp
  - dlna
  - ssdp
  - igd
  - networking

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  # xml 7.0.1 deprecates the `namespace`/`namespaces` arguments, but their
  # replacements need Dart 3.11, above the SDK floor set above. Call sites keep
  # the deprecated form behind `// ignore: deprecated_member_use` until then.
  xml: '>=6.6.1 <8.0.0'
  collection: ^1.19.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.0
