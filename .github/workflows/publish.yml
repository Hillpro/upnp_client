# .github/workflows/publish.yml
name: Publish to pub.dev

on:
  push:
    tags:
    - 'v[0-9]+.[0-9]+.[0-9]+' # tag pattern on pub.dev: 'v{{version}'

jobs:
  publish:
    permissions:
      id-token: write # Required for authentication using OIDC
      contents: write # Required to create the GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        run: dart pub get

      # Verify, never rewrite. Anything that mutates the checkout here would
      # publish bytes that no longer match the tag, unreviewed and untested.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze
      - name: Run tests
        run: dart test

      - name: Publish - dry run
        run: dart pub publish --dry-run
      - name: Publish
        run: dart pub publish --force

      # Last, so a failed publish never leaves a release advertising a
      # version that is not on pub.dev. The tag is passed through env rather
      # than interpolated into the script, and ${TAG#v} turns v1.0.0 into the
      # release name 1.0.0.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "${TAG#v}" --generate-notes
